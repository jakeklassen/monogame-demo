[tools]
dotnet = "10.0.301"

# Android (NVIDIA Shield) build tooling — a full JDK plus ANDROID_HOME — is
# machine/OS-specific and only needed where you build the platforms/Android head
# (Linux/WSL). It lives in mise.local.toml (gitignored) so this shared config
# stays cross-platform. To set that up on a build machine:
#
#   mise use --path mise.local.toml java@temurin-21
#   # then in mise.local.toml add:  [env]\n  ANDROID_HOME = "{{env.HOME}}/android-sdk"
#
# Desktop-only checkouts (Windows/macOS) just need dotnet above.
